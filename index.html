<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Random User Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <header>
        <h1>Random User Generator</h1>
    </header>

    <main>
        <section class="container">
            <article class="user-card">

                <div id="loader">
                    <!-- Loader -->
                </div>

                <section class="user-photo">
                    <img id="user-photo" alt="Fotografie utilizator">
                </section>

                <section class="user-info">
                    <h2 id="user-name">Nume complet</h2>
                    <p id="user-email">email@example.com</p>
                    <p id="user-country">Țară</p>
                </section>

                <section class="user-actions">
                    <button id="generate-user-btn" type="button">
                        Generează utilizator
                    </button>
                </section>

            </article>
        </section>
    </main>

</body>
</html>
<!-- HTML structure -->
